packages:
  - shared
  - domain
  - worker
  - infra
  - acceptance-tests

# strict: `pnpm add` refuses to add a package that's already in the catalog at a different
# version, so a new install can't drift silently. This only gates the `pnpm add` CLI path —
# verified empirically that a hand-edited package.json version outside the catalog installs
# without complaint, so it's not a substitute for reviewing package.json diffs by eye.
catalogMode: strict

# Refuse to resolve any dependency published in the last 24h instead of silently falling back to
# one that fails the check (pnpm's non-strict default) — supply-chain-attack packages are
# typically pulled within hours of publish, so a hard age floor is worth the occasional wait on a
# same-day release. Strict resolution failure forces a deliberate, reviewable
# `minimumReleaseAgeExclude` entry rather than a silent bypass. No exclusions currently needed —
# every catalog version below is older than 24h.
minimumReleaseAgeStrict: true

catalog:
  # ESLint's own recommended rule set, pulled in by shared's baseConfig for every package.
  "@eslint/js": 10.0.1
  # Type-only defs for shared's LEDGER_REQUEST_SCHEMA (the API GW request validator's JSON Schema).
  "@types/json-schema": 7.0.15
  # Node type defs — held at the Node 24 major to match the pinned runtime, not the latest major.
  "@types/node": 24.13.6
  # The CDK L2 construct library infra's stacks and constructs are built on.
  aws-cdk-lib: 2.270.0
  # The CDK constructs framework aws-cdk-lib itself requires as a peer.
  constructs: 10.8.1
  # Bundles the worker Lambda at CDK synth (NodejsFunction) so synth needs no Docker.
  esbuild: 0.28.2
  # The linter every package runs via `pnpm lint`.
  eslint: 10.11.0
  # Turns off ESLint rules that conflict with Prettier's formatting.
  eslint-config-prettier: 10.1.8
  # Predefined global-variable sets (Node, ES2022) fed to ESLint's languageOptions.globals.
  globals: 17.12.0
  # The formatter every package runs via `pnpm format` — 3.9.9 (latest) failed minimumReleaseAgeStrict.
  prettier: 3.9.6
  # The compiler — pinned below latest since TS7's native compiler breaks ts-node's API (Phase 1 spike).
  typescript: 6.0.3
  # TypeScript-aware ESLint parser and rules, pulled in by shared's baseConfig for every package.
  typescript-eslint: 8.70.1
  # The test runner every package's `test`/`checks` script runs.
  vitest: 5.0.1

# pnpm blocks dependency install scripts unless explicitly decided here. esbuild's postinstall only
# sanity-checks its platform binary (which arrives via optionalDependencies), so it's denied —
# verified `esbuild --version` and CDK bundling work without it.
allowBuilds:
  esbuild: false
