name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint, format, type-check and unit + CDK snapshot tests across every package.
  # Needs no AWS or LocalStack (see docs/PLAN.md, Phase 7).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks
